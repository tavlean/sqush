<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SVG is the primary favicon: crisp at every size and theme-aware (the
         mark is graphite in light UI, white in dark). PNG is the fallback for
         engines without SVG-favicon support. Apple touch icon must be PNG. -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <!-- The web-app manifest is what makes Chrome offer "Install app" in the
         omnibox (a linked manifest with 192/512 icons plus the controlling
         service worker satisfies the installability criteria). Icons are
         regenerated with `npm run pwa-icons` after any brand change. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- iOS standalone extras. Modern iOS reads the manifest (display,
         short_name), so these cover two Safari-only gaps: older iOS needs the
         capable/title pair to go standalone under the right name, and the
         status-bar tint in standalone mode is controlled ONLY by this Safari
         meta ("black" = opaque black bar, matching the dark app without
         needing safe-area layout work). Startup-splash images are deliberately
         omitted: a cosmetic launch frame is not worth ~30 device-specific
         PNGs in every visitor's precache. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Frisp" />

    <!-- Search and link-preview metadata. This HAS to live here rather than in a
         `<svelte:head>`: the app runs with `ssr = false`, so component head
         content is added by JS after hydration and never appears in the
         prerendered HTML. Search engines mostly execute JS now, but social
         crawlers (Slack, iMessage, WhatsApp, Facebook, X, LinkedIn) do not, so
         anything they must read has to be in this static shell.

         Consequence for a rebrand: the name and URL below are the ONE place
         outside `src/shared/brand.ts` where the brand is written in code, because
         a static HTML template cannot import it. `docs/project-identity.md` lists
         this file as a rename touch-point. Copy rationale: `docs/seo.md`.

         The title here is the crawler-visible page identity and is deliberately
         richer than the runtime tab title, which `+page.svelte` replaces with
         progress and the open filename ("⏳ photo.jpg - Frisp - Compress
         images"). Both are correct for their own job. -->
    <title>Frisp - Compress and convert images in your browser</title>
    <meta
      name="description"
      content="Compress images to WebP, AVIF, JPEG XL, PNG or JPEG and optimize SVGs, right in your browser. Compare before and after, resize, and export. Nothing is uploaded."
    />
    <link rel="canonical" href="https://frisp.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frisp" />
    <!-- Short on purpose: the card image already carries the tagline, so a full
         sentence here would repeat itself in the preview. -->
    <meta property="og:title" content="Frisp" />
    <meta
      property="og:description"
      content="Compress images to WebP, AVIF, JPEG XL, PNG or JPEG and optimize SVGs, right in your browser. Compare before and after, resize, and export. Nothing is uploaded."
    />
    <meta property="og:url" content="https://frisp.app/" />
    <!-- Absolute URL required: crawlers do not resolve relative image paths.
         Regenerate with `npm run social-card` after any brand change. -->
    <meta property="og:image" content="https://frisp.app/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A dark card inside a dashed orange viewfinder. The Frisp logomark and name sit above large bold text reading: smaller images, same quality. Below it: in your browser, no uploads, works offline."
    />
    <!-- X and several other consumers fall back to the og:* tags above for
         title, description, and image, so only the card type needs declaring. -->
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
